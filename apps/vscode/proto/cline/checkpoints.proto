syntax = "proto3";

package cline;

import "cline/common.proto";

option go_package = "github.com/cline/grpc-go/cline";
option java_multiple_files = true;
option java_package = "bot.cline.proto";

service CheckpointsService {
  rpc checkpointRestore(CheckpointRestoreRequest) returns (Empty);
  // Opens a multi-file diff of everything that changed between the latest
  // checkpoint (snapshotted when the user's last message started a run) and
  // the current working tree.
  rpc checkpointViewLatestChanges(EmptyRequest) returns (Empty);
  // Returns how many files changed between the latest checkpoint and the
  // current working tree (0 when no checkpoint exists). Used to enable the
  // "View Changes" button only when there is something to show.
  rpc checkpointLatestChangesCount(EmptyRequest) returns (Int64);
  // Reports whether Reset Code can restore the workspace from the user
  // message with the given ts. Asked when the user opens a message for
  // editing, so the answer reflects the checkpoints that exist right then.
  rpc checkpointExistsForMessage(Int64Request) returns (Boolean);
  // Lists the files changed between the latest checkpoint and the current
  // working tree, with their status and added/removed line counts.
  rpc checkpointLatestChangedFiles(EmptyRequest) returns (ChangedFiles);
  // Opens the diff of one changed file. The request value is its absolute
  // path, as returned by checkpointLatestChangedFiles.
  rpc checkpointViewFileChanges(StringRequest) returns (Empty);
  // Restores one changed file to its content at the latest checkpoint, or
  // deletes it if the agent created it. The request value is its absolute path.
  rpc checkpointRevertFile(StringRequest) returns (Empty);
}

enum ChangedFileStatus {
  CHANGED_FILE_MODIFIED = 0;
  CHANGED_FILE_ADDED = 1;
  CHANGED_FILE_DELETED = 2;
}

message ChangedFile {
  string path = 1; // Absolute path
  string relative_path = 2; // Relative to the task's working directory
  ChangedFileStatus status = 3;
  int32 added_lines = 4;
  int32 removed_lines = 5;
}

message ChangedFiles {
  repeated ChangedFile files = 1;
}

message CheckpointRestoreRequest {
  Metadata metadata = 1;
  int64 number = 2;
  string restore_type = 3;
  optional int64 offset = 4;
}
